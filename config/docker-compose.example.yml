# Example Compose deployment.
# Run from the repository root with:
#   docker compose -f config/docker-compose.example.yml --env-file .env up -d --build
# Set POSTGRES_PASSWORD and MINIO_ROOT_PASSWORD in .env first.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - adcraft-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - adcraft-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-adcraft}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-adcraft_erp}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-adcraft}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-adcraft_erp}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
      - ../.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - adcraft-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adcraft_erp}
      POSTGRES_USER: ${POSTGRES_USER:-adcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - adcraft_example_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adcraft} -d ${POSTGRES_DB:-adcraft_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - adcraft-net

  redis:
    image: redis:7-alpine
    volumes:
      - adcraft_example_redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - adcraft-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - adcraft_example_minio:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    restart: unless-stopped
    networks:
      - adcraft-net

  backup:
    image: alpine:3.21
    volumes:
      - ../backups:/backups
      - ../uploads:/uploads:ro
      - ../scripts:/scripts:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-adcraft_erp}
      POSTGRES_USER: ${POSTGRES_USER:-adcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command: ["sh", "-c", "while true; do sleep 86400; done"]
    restart: unless-stopped
    networks:
      - adcraft-net

networks:
  adcraft-net:
    driver: bridge

volumes:
  adcraft_example_postgres:
  adcraft_example_redis:
  adcraft_example_minio:
