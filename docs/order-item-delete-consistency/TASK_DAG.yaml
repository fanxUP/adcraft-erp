version: 1
name: order-item-delete-consistency
mode: STRICT
status: verification
objective: >-
  删除订单明细时，统一清理设计、制作、安装三类任务的当前有效关联，
  重新计算任务进度和订单汇总；订单没有有效明细时自动进入回收站，
  并通过预检、确认、事务、审计和可恢复快照保证数据一致性。
non_goals:
  - order_level_manual_cancel_semantics
  - quote_hard_delete
  - physical_delete_of_financial_or_audit_facts
  - deleting_order_stage_attachments_by_filename_guess
  - force_delete_paid_or_settled_facts
  - selective_restore_of_one_deleted_item
nodes:
  - id: OID-P01
    title: 现状契约、数据盘点和失败用例冻结
    status: planned
    acceptance: A-OID-01
    depends_on: []
  - id: OID-P02
    title: 任务关联生命周期和任务范围模型
    status: planned
    acceptance: A-OID-02
    depends_on: [OID-P01]
  - id: OID-P03
    title: 删除影响预检和确认契约
    status: planned
    acceptance: A-OID-03
    depends_on: [OID-P01, OID-P02]
  - id: OID-P04
    title: 实现统一订单明细删除事务
    status: planned
    acceptance: A-OID-04
    depends_on: [OID-P02, OID-P03]
  - id: OID-P05
    title: 三阶段任务和订单聚合重算
    status: planned
    acceptance: A-OID-05
    depends_on: [OID-P02, OID-P04]
  - id: OID-P06
    title: 回收站恢复和关联数据安全适配
    status: planned
    acceptance: A-OID-06
    depends_on: [OID-P04, OID-P05]
