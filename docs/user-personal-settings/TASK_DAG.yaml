version: 1
name: user-personal-settings
objective: >-
  为每个登录用户提供独立的密码、界面风格和文字大小设置，并让偏好在桌面端与移动端
  持久化、按账号隔离，同时不改变既有角色权限和业务数据可见范围。
mode: STRICT
nodes:
  - id: USER-PREF-P01
    title: 冻结入口、范围与重复设置清理策略
    acceptance: A-USER-PREF-01
    depends_on: []
  - id: USER-PREF-P02
    title: 建立用户偏好数据模型和接口契约
    acceptance: A-USER-PREF-02
    depends_on: [USER-PREF-P01]
  - id: USER-PREF-P03
    title: 收紧密码修改与重置后的安全语义
    acceptance: A-USER-PREF-03
    depends_on: [USER-PREF-P01]
  - id: USER-PREF-P04
    title: 统一用户偏好加载、应用和按账号缓存
    acceptance: A-USER-PREF-04
    depends_on: [USER-PREF-P02, USER-PREF-P03]
  - id: USER-PREF-P05
    title: 实现桌面端和移动端个人设置界面
    acceptance: A-USER-PREF-05
    depends_on: [USER-PREF-P04]
  - id: USER-PREF-P06
    title: 安全、回归和交付质量验证
    acceptance: A-USER-PREF-06
    depends_on: [USER-PREF-P05]
edges:
