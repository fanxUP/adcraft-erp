name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adcraft_test
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: adcraft_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U adcraft_test -d adcraft_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://adcraft_test:isolated-ci-password@localhost:5432/adcraft_test
      DATABASE_URL_SYNC: postgresql+psycopg2://adcraft_test:isolated-ci-password@localhost:5432/adcraft_test
      EXPENDITURE_TEST_URL: postgresql+asyncpg://adcraft_test:isolated-ci-password@localhost:5432/adcraft_test
      ORDER_FIRST_TEST_URL: postgresql+asyncpg://adcraft_test:isolated-ci-password@localhost:5432/adcraft_test
      SUPPLIER_MIGRATION_TEST_URL: postgresql+psycopg2://adcraft_test:isolated-ci-password@localhost:5432/adcraft_test
      FINANCE_RECON_MIGRATION_TEST_URL: postgresql+psycopg2://adcraft_test:isolated-ci-password@localhost:5432/adcraft_test
      CI_REQUIRE_DATABASE_TESTS: '1'
      SECRET_KEY: isolated-ci-signing-key-with-no-production-access
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --require-hashes -r requirements-bootstrap.txt
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: 从空库重放迁移
        run: alembic upgrade head
      - name: 执行测试
        run: pytest -q

  frontend:
    name: 前端质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 校验 AI 页面能力契约
        run: npm run check:ai-contract
      - name: 类型与生产构建
        run: npm run build
      - name: 前端单元测试
        run: npm test
      - name: 代码规范
        run: npm run lint
      - name: 依赖安全审计
        run: npm audit --audit-level=high

  infrastructure:
    name: 基础设施配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 生成 Compose 校验环境
        run: |
          cp .env.example .env
          printf 'POSTGRES_PASSWORD=ci-postgres-password\nMINIO_ROOT_PASSWORD=ci-minio-password\n' >> .env
      - name: 校验 Compose 配置
        run: docker compose config --quiet
      - name: 部署脚本回归
        run: bash scripts/tests/test_deploy.sh
