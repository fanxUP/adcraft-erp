name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -e ".[dev,ai]"
      - name: 执行测试
        run: pytest -q

  frontend:
    name: 前端质量检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 校验 AI 页面能力契约
        run: npm run check:ai-contract
      - name: 类型与生产构建
        run: npm run build
      - name: 前端单元测试
        run: npm test
      - name: 代码规范
        run: npm run lint
      - name: 依赖安全审计
        run: npm audit --audit-level=high

  infrastructure:
    name: 基础设施配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 Compose 配置
        run: docker compose config --quiet
